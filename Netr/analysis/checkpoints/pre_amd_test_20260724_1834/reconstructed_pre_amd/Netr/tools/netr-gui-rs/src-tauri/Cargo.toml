[package]
name = "guardmeta-vsp"
version = "0.1.0"
description = "御元虚拟化安全工具 — GuardMetaVirtualSecurityPlatform"
authors = ["GuardMeta"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 uses a library plus desktop binary entry point.
name = "guardmeta_vsp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Production network authorization SDK.  The private SDK is not installed on
# every offline build machine, so the checked-in placeholder fails explicitly
# only when `network-license` is selected.  Replace these two paths with the
# real yuyuan-client/yuyuan-protocol crates for a production licensed build.
yuyuan-client = { path = "license-sdk-unavailable/yuyuan-client", optional = true }
yuyuan-protocol = { path = "license-sdk-unavailable/yuyuan-protocol", optional = true }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

# Async command/runtime support.
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "process", "io-util"] }
parking_lot = "0.12"

# Debugger disassembly/assembly.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "intel", "code_asm", "instr_info"] }

# Embedded Lua 5.4, built from vendored source.
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }

# HTTP client used by the LLM integration; rustls avoids an OpenSSL runtime.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Agent loop concurrency and memory scanning.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rayon = "1.10"
smallvec = { version = "1", features = ["union"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
]

[features]
# The current project/test workflow is open and does not require login.
# A future licensed build selects `network-license` after wiring the private
# SDK paths. `dev-license-bypass` remains an explicit compatibility feature.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
network-license = ["dep:yuyuan-client", "dep:yuyuan-protocol"]
dev-license-bypass = []
